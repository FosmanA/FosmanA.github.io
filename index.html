<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOA Studios</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1c1c1c; --muted: #6b6b6b; --accent: #d9432b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141414; --fg: #eeeeea; --muted: #9a9a95; --accent: #ff6a4d; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--fg);
           font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { padding: 32px 16px; max-width: 520px; }
    h1 { margin: 0 0 4px; font-size: 2rem; letter-spacing: .02em; }
    p { margin: 0 0 20px; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0 0 28px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>FOA Studios</h1>
    <p>Bağımsız mobil oyun stüdyosu.</p>
    <ul>
      <li><a href="https://play.google.com/store/apps/details?id=com.osmanalkan.kirikay">Kırıkay — Google Play</a></li>
    </ul>
    <p>İletişim: <a href="mailto:main@foastudios.com">main@foastudios.com</a></p>
  </main>
</body>
</html>
