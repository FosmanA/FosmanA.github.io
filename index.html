<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOA Studios</title>
  <meta name="description" content="FOA Studios is a small independent game studio in Türkiye making pixel games.">
  <meta property="og:title" content="FOA Studios">
  <meta property="og:description" content="FOA Studios is a small independent game studio in Türkiye making pixel games.">
  <meta name="theme-color" content="#1E1C3F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Old+Turkic&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #1E1C3F;
      --deep: #15142E;
      --gold: #F4C23A;
      --gold-shade: #9C6B10;
      --moon: #DCD8F4;
      --dim: #9A96C4;
    }
    * { box-sizing: border-box; }
    html { background: var(--night); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--night) url(stars.svg) repeat;
      color: var(--moon);
      font: 400 1.125rem/1.6 "Pixelify Sans", system-ui, sans-serif;
    }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    .top { display: flex; justify-content: flex-end; padding: 16px; }
    .lang {
      font: 600 1rem/1 "Pixelify Sans", system-ui, sans-serif;
      color: var(--gold);
      background: transparent;
      border: 2px solid var(--gold);
      padding: 8px 12px;
      cursor: pointer;
    }
    .lang:hover { background: var(--gold); color: var(--deep); }

    main {
      flex: 1;
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 24px 64px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 440px);
      gap: clamp(40px, 7vw, 104px);
      align-items: center;
    }
    h1 {
      margin: 0;
      font-weight: 700;
      font-size: clamp(3rem, 8.5vw, 6.5rem);
      line-height: .95;
      color: var(--gold);
      text-shadow: .06em .06em 0 var(--gold-shade);
    }
    .runes {
      margin: 28px 0 0;
      font: 400 clamp(1.5rem, 3vw, 2rem)/1 "Noto Sans Old Turkic", sans-serif;
      letter-spacing: .3em;
      color: var(--dim);
    }
    .lede {
      margin: 28px 0 0;
      max-width: 34ch;
      font-size: clamp(1.125rem, 1.8vw, 1.35rem);
      line-height: 1.55;
    }
    .contact { margin: 24px 0 0; color: var(--dim); }
    .contact a {
      color: var(--gold);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }
    .links { margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 8px 28px; }
    .links a {
      color: var(--gold);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .frame {
      aspect-ratio: 1;
      border: clamp(4px, .9vw, 7px) solid var(--gold);
      border-radius: clamp(20px, 3vw, 32px);
      background: var(--deep);
      overflow: hidden;
      box-shadow: 10px 10px 0 rgba(10, 9, 28, .55);
    }
    #field { display: block; width: 100%; height: 100%; touch-action: pan-y; }

    .kilim { height: 44px; background-repeat: repeat-x; background-position: center bottom; image-rendering: pixelated; }

    @media (max-width: 760px) {
      main { grid-template-columns: minmax(0, 1fr); gap: 40px; padding-top: 8px; }
      .frame { width: 100%; max-width: 440px; }
    }
  </style>
</head>
<body>
  <div class="top">
    <button class="lang" id="lang" type="button" aria-label="Türkçeye geç">TR</button>
  </div>

  <main>
    <section>
      <h1>FOA Studios</h1>
      <p class="runes" aria-hidden="true" data-i18n-title="runeTitle" title="“Türük” in Old Turkic (Orkhon) script"><span lang="otk">𐱅𐰇𐰼𐰜</span></p>
      <p class="lede" data-i18n="lede">A small independent game studio in Türkiye. We make pixel games and take our patterns from the kilim.</p>
      <p class="contact"><span data-i18n="write">Write to us:</span> <a href="mailto:main@foastudios.com">main@foastudios.com</a></p>
      <p class="links">
        <a href="https://play.google.com/store/apps/details?id=com.osmanalkan.kirikay" data-i18n="play">Kırıkay on Google Play</a>
        <a href="kirikay-gizlilik/" data-i18n="privacy">Kırıkay privacy policy</a>
      </p>
    </section>
    <div class="frame">
      <canvas id="field" role="img" data-i18n-aria="field" aria-label="A ball breaking a wall of kilim-patterned bricks"></canvas>
    </div>
  </main>

  <footer class="kilim" aria-hidden="true"></footer>

  <script>
  (() => {
    // ---- language ----
    const T = {
      en: {
        lede: "A small independent game studio in Türkiye. We make pixel games and take our patterns from the kilim.",
        write: "Write to us:",
        play: "Kırıkay on Google Play",
        privacy: "Kırıkay privacy policy",
        runeTitle: "“Türük” in Old Turkic (Orkhon) script",
        field: "A ball breaking a wall of kilim-patterned bricks",
        desc: "FOA Studios is a small independent game studio in Türkiye making pixel games.",
        other: "TR", otherLabel: "Türkçeye geç"
      },
      tr: {
        lede: "Türkiye'de küçük, bağımsız bir oyun stüdyosu. Piksel oyunlar yapıyoruz, desenlerimizi kilimden alıyoruz.",
        write: "Bize yazın:",
        play: "Kırıkay Google Play'de",
        privacy: "Kırıkay gizlilik politikası",
        runeTitle: "Orhun yazısıyla “Türük”",
        field: "Kilim desenli tuğlalardan bir duvarı kıran top",
        desc: "FOA Studios, Türkiye'de piksel oyunlar yapan küçük, bağımsız bir oyun stüdyosu.",
        other: "EN", otherLabel: "Switch to English"
      }
    };
    const btn = document.getElementById('lang');
    let lang = null;
    try { lang = localStorage.getItem('lang'); } catch (e) {}
    if (lang !== 'tr' && lang !== 'en') {
      lang = (navigator.language || '').toLowerCase().startsWith('tr') ? 'tr' : 'en';
    }
    function applyLang(l) {
      const t = T[l];
      document.documentElement.lang = l;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t[el.dataset.i18nTitle]; });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t[el.dataset.i18nAria]); });
      document.querySelector('meta[name="description"]').content = t.desc;
      btn.textContent = t.other;
      btn.setAttribute('aria-label', t.otherLabel);
    }
    applyLang(lang);
    btn.addEventListener('click', () => {
      lang = lang === 'tr' ? 'en' : 'tr';
      applyLang(lang);
      try { localStorage.setItem('lang', lang); } catch (e) {}
    });

    // ---- kilim pattern: one letter per brick ----
    const COLORS = { R: '#C0363C', O: '#E07A2E', B: '#4A86C8', Y: '#F4C23A', C: '#EDE3CC' };
    // two göz (eye) diamonds between hem rows; bricks are 2:1, so the diamond steps one column every two rows
    const PAT = (() => {
      const tile = [];
      for (let r = 0; r < 9; r++) {
        let row = '';
        for (let c = 0; c < 7; c++) {
          const dy = Math.abs(r - 4), d = 2 * Math.abs(c - 3) + dy;
          row += d <= 1 ? 'Y' : d <= 3 ? 'B' : d <= 5 ? 'C' : (d === 6 && dy === 0) ? 'Y' : 'R';
        }
        tile.push(row + row);
      }
      return ['OBOBOBOBOBOBOB', ...tile, 'BOBOBOBOBOBOBO'];
    })();
    const COLS = PAT[0].length, ROWS = PAT.length;

    function shade(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const to = amt < 0 ? 0 : 255, a = Math.abs(amt);
      const mix = c => Math.round(c + (to - c) * a);
      return `rgb(${mix(n >> 16)},${mix((n >> 8) & 255)},${mix(n & 255)})`;
    }
    function drawBrick(ctx, x, y, w, h, hex, u) {
      ctx.fillStyle = hex; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = shade(hex, .3); ctx.fillRect(x, y, w, u);
      ctx.fillStyle = shade(hex, -.3); ctx.fillRect(x, y + h - u, w, u);
    }

    // hem along the bottom of the page
    (function kilimBand() {
      const el = document.querySelector('.kilim');
      const bw = 8, bh = 4, d = Math.max(1, Math.round(window.devicePixelRatio || 1));
      const c = document.createElement('canvas');
      c.width = COLS * bw * d; c.height = ROWS * bh * d;
      const x = c.getContext('2d');
      PAT.forEach((row, r) => [...row].forEach((k, col) =>
        drawBrick(x, col * bw * d, r * bh * d, bw * d, bh * d, COLORS[k], d)));
      el.style.backgroundImage = `url(${c.toDataURL()})`;
      el.style.backgroundSize = `${COLS * bw}px ${ROWS * bh}px`;
    })();

    // ---- playfield: a ball keeps breaking the kilim wall, bricks grow back ----
    const cv = document.getElementById('field');
    const ctx = cv.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let S, g, bricks, ball, paddle, parts, stars, aim = 0;
    const user = { x: 0, until: 0 };

    function setup() {
      const dpr = window.devicePixelRatio || 1;
      S = Math.max(1, Math.round(cv.clientWidth * dpr));
      cv.width = S; cv.height = S;
      const pad = Math.round(S * .07);
      const bw = (S - 2 * pad) / COLS, bh = bw / 2;
      g = { pad, bw, bh, gap: Math.max(1, Math.round(S * .005)), u: Math.max(1, Math.round(bh / 7)) };
      bricks = [];
      PAT.forEach((row, r) => [...row].forEach((k, c) =>
        bricks.push({ x: pad + c * bw, y: pad + r * bh, w: bw, h: bh, k, alive: true, back: 0, born: -1e9 })));
      // open mid-game: a few bricks already knocked out of the lower hem, ball on its way up
      const now = performance.now();
      [[ROWS - 1, 1], [ROWS - 1, 2], [ROWS - 1, 5], [ROWS - 1, 6], [ROWS - 1, 9], [ROWS - 1, 12],
       [ROWS - 2, 5], [ROWS - 2, 6], [ROWS - 2, 12], [ROWS - 3, 6]].forEach(([r, c], i) => {
        const b = bricks[r * COLS + c];
        b.alive = false; b.back = now + 3000 + i * 700;
      });
      const pw = S * .22, ph = Math.max(4, Math.round(bh * .55));
      paddle = { w: pw, h: ph, x: S * .42 - pw / 2, y: S - pad - ph };
      const r = S * .022, sp = S * .55, a = -Math.PI / 2 + .5;
      ball = { x: S * .58, y: S * .68, r, sp, vx: sp * Math.cos(a), vy: sp * Math.sin(a) };
      parts = [];
      stars = Array.from({ length: 26 }, () => ({
        x: Math.random() * S, y: Math.random() * S,
        s: Math.max(1, Math.round(S * (Math.random() < .2 ? .008 : .005))), p: Math.random() * 6.28
      }));
    }

    function overlaps(b) {
      return ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
             ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h;
    }
    function breakBrick(b, now) {
      b.alive = false;
      b.back = now + 6000 + Math.random() * 6000;
      for (let i = 0; i < 6; i++) {
        parts.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: (Math.random() - .5) * S * .6,
                     vy: (Math.random() - .7) * S * .5, life: .55, k: b.k });
      }
    }
    function hitWall(now) {
      for (const b of bricks) {
        if (b.alive && overlaps(b)) { breakBrick(b, now); return true; }
      }
      return false;
    }
    function landingX() {
      const L = g.pad + ball.r, R = S - g.pad - ball.r, w = R - L;
      const t = (paddle.y - ball.r - ball.y) / ball.vy;
      const m = (((ball.x + ball.vx * t - L) % (2 * w)) + 2 * w) % (2 * w);
      return L + (m <= w ? m : 2 * w - m);
    }

    function update(dt, now) {
      const { pad } = g;
      // horizontal move, then vertical, so each brick hit flips one axis
      ball.x += ball.vx * dt;
      if (ball.x - ball.r < pad) { ball.x = pad + ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.r > S - pad) { ball.x = S - pad - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (hitWall(now)) { ball.x -= ball.vx * dt; ball.vx = -ball.vx; }

      ball.y += ball.vy * dt;
      if (ball.y - ball.r < pad) { ball.y = pad + ball.r; ball.vy = Math.abs(ball.vy); }
      if (hitWall(now)) { ball.y -= ball.vy * dt; ball.vy = -ball.vy; }

      if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r < paddle.y + paddle.h &&
          ball.x > paddle.x - ball.r && ball.x < paddle.x + paddle.w + ball.r) {
        const off = Math.max(-1, Math.min(1, (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2)));
        const a = -Math.PI / 2 + off * 1.0;
        ball.vx = ball.sp * Math.cos(a); ball.vy = ball.sp * Math.sin(a);
        ball.y = paddle.y - ball.r;
        aim = (Math.random() * 2 - 1) * .65;
      }
      if (ball.y + ball.r > S - pad * .5) { ball.y = S - pad * .5 - ball.r; ball.vy = -Math.abs(ball.vy); }

      // paddle: the visitor steers for a moment, otherwise it plays itself
      let target, speed = S * 1.2;
      if (now < user.until) { target = user.x; speed = S * 4; }
      else if (ball.vy > 0) target = landingX() - aim * paddle.w / 2;
      else target = S / 2 + (ball.x - S / 2) * .5;
      const cx = paddle.x + paddle.w / 2;
      const step = Math.max(-speed * dt, Math.min(speed * dt, target - cx));
      paddle.x = Math.max(pad, Math.min(S - pad - paddle.w, paddle.x + step));

      for (const b of bricks) {
        if (!b.alive && now > b.back && !overlaps(b)) { b.alive = true; b.born = now; }
      }
      for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += S * 1.4 * dt; p.life -= dt; }
      parts = parts.filter(p => p.life > 0);
    }

    function draw(now) {
      const { gap, u } = g;
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#15142E';
      ctx.fillRect(0, 0, S, S);
      for (const s of stars) {
        ctx.globalAlpha = reduce ? .5 : .35 + .35 * Math.sin(now / 900 + s.p);
        ctx.fillStyle = '#7A76B8';
        ctx.fillRect(Math.round(s.x), Math.round(s.y), s.s, s.s);
      }
      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.globalAlpha = Math.min(1, (now - b.born) / 450);
        const x = Math.round(b.x), y = Math.round(b.y);
        drawBrick(ctx, x + gap, y + gap, Math.round(b.x + b.w) - x - gap, Math.round(b.y + b.h) - y - gap, COLORS[b.k], u);
      }
      const ps = Math.max(2, Math.round(S * .012));
      for (const p of parts) {
        ctx.globalAlpha = Math.max(0, p.life / .55);
        ctx.fillStyle = COLORS[p.k];
        ctx.fillRect(Math.round(p.x), Math.round(p.y), ps, ps);
      }
      ctx.globalAlpha = 1;
      drawBrick(ctx, Math.round(paddle.x), paddle.y, Math.round(paddle.w), paddle.h, '#F4C23A', Math.max(1, Math.round(paddle.h / 4)));
      ctx.fillStyle = '#9C6B10';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#F4C23A';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * .82, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FFE39A';
      ctx.beginPath(); ctx.arc(ball.x - ball.r * .3, ball.y - ball.r * .3, ball.r * .28, 0, Math.PI * 2); ctx.fill();
    }

    // with reduced motion the field stays still and only plays while the visitor is steering it
    let visible = true, last = 0, raf = 0;
    function frame(t) {
      raf = 0;
      if (!visible || (reduce && t > user.until)) return;
      const dt = Math.min(1 / 30, (t - (last || t)) / 1000);
      last = t;
      update(dt, t);
      draw(t);
      raf = requestAnimationFrame(frame);
    }
    function start() {
      if (raf || (reduce && performance.now() > user.until)) return;
      last = 0;
      raf = requestAnimationFrame(frame);
    }

    setup();
    draw(performance.now());
    new ResizeObserver(() => {
      if (Math.round(cv.clientWidth * (window.devicePixelRatio || 1)) !== S) { setup(); draw(performance.now()); }
    }).observe(cv);
    new IntersectionObserver(entries => {
      visible = entries[0].isIntersecting;
      if (visible) start();
    }).observe(cv);
    cv.addEventListener('pointermove', e => {
      const rect = cv.getBoundingClientRect();
      user.x = (e.clientX - rect.left) * (S / rect.width);
      user.until = performance.now() + 1800;
      start();
    });
    start();
  })();
  </script>
</body>
</html>
